
version: '3.9'

services:
  vuln_lab:
    image: tleemcjr/metasploitable2
    container_name: vuln_lab
    hostname: metasploitable
    networks:
      lab-net:
        ipv4_address: 192.168.100.91    # ← IP FIJA DEL TARGET
    ports:
      - "21:21"
      - "22:22"
      - "23:23"
      - "25:25"
      - "53:53"
      - "80:80"
      - "111:111"
      - "139:139"
      - "445:445"
      - "512:512"
      - "513:513"
      - "514:514"
      - "1099:1099"
      - "1524:1524"
      - "2049:2049"
      - "2121:2121"
      - "3306:3306"
      - "3632:3632"
      - "15432:5432"
      - "5900:5900"
      - "6000:6000"
      - "6200:6200"     # ← vsFTPd BACKDOOR
      - "6667:6667"
      - "8180:8180"
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali_attacker
    hostname: kali
    networks:
      lab-net:
        ipv4_address: 192.168.100.85     # ← IP FIJA DEL ATTACKER
    stdin_open: true
    tty: true
    command: /bin/bash

  monitor:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh_monitor
    hostname: wazuh
    networks:
      lab-net:
        ipv4_address: 192.168.100.90     # ← IP FIJA DEL MONITOR
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - wazuh_data:/var/ossec/data

networks:
  lab-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24       # ← RANGO DE SUBRED
          gateway: 192.168.100.1         # ← GATEWAY
          ip_range: 192.168.100.64/26    # ← RANGO DISPONIBLE

volumes:
  wazuh_data:
